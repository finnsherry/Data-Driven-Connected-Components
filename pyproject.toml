[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ddcc"
version = "0.1.0"
description = "Data-driven connected components on M_2, using PyTorch."
authors = [{ name = "Finn Sherry" }]
requires-python = ">=3.10"
dependencies = ["torch", "tqdm", "scikit-image", "scipy"]

[tool.setuptools.packages.find]
include = ["ddcc*"]
